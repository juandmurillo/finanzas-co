[project]
name = "finanzas"
version = "0.1.0"
description = "Backend local de la app de finanzas personales (FastAPI + SQLite)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
    "anthropic>=2.3.0",
]

[project.scripts]
finanzas = "finanzas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finanzas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = []
